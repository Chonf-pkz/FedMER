# Corrected FedProc rerun configuration for the IEMOCAP speaker-shard split.
# Override model.name from the CLI to rerun each benchmark architecture.

dataset: IEMOCAP
num_classes: 4

model:
  # Supported benchmark models: cemobam, fleser, memocmt, threemser
  name: fleser

paths:
  data_root: ../dataset/IEMOCAP_full_release
  out_base: metadata/IEMOCAP_loso/clients
  features_base: features/IEMOCAP/clients
  checkpoints_root: checkpoints/federated_fedproc_corrected
  logs_root: logs/federated_fedproc_corrected

loso:
  split_by: speaker_shards
  val_speaker: null
  test_speakers: null
  test_sessions: [5]
  seeds: [42, 52, 103, 128, 923]
  num_clients: null
  shards_per_speaker: 4
  emotions_per_client: 3
  client_val_ratio: 0.2
  min_labeled_per_client: 1
  seed: 42
  exp_prefix: IEMOCAP_speaker_shards
  run_id: run_20260608_speaker4shards_3emo_5seeds
  clean_metadata: false
  clean_features: false
  eval_checkpoint: best

federated:
  rounds_pretrain: 50
  local_epochs_pretrain: 5
  batch_size: 32
  modality: both
  lr: 0.0001
  weight_decay: 0.01
  weight_by: total
  best_metric: global_UA
  fl_method: fedproc
  fedproc_lambda: 1.0
  fedproc_temperature: 0.5
  fedprox_mu: 0.0
  feddc_correction_weight: 1.0
  feddc_drift_momentum: 0.0
  # One process is the safe setting for the current RTX 4050 Laptop (6 GB).
  num_workers: 1
