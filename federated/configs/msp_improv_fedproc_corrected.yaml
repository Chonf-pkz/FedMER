# Corrected FedProc rerun configuration for the existing MSP-IMPROV
# speaker-shard metadata/features. Run federated.run_federated once per seed,
# because each seed has a different clients_root/features_root.

dataset: MSP-IMPROV
num_classes: 4

model:
  # Supported benchmark models: cemobam, fleser, memocmt, threemser
  name: fleser

paths:
  checkpoints_root: checkpoints/federated_fedproc_corrected
  logs_root: logs/federated_fedproc_corrected

federated:
  rounds_pretrain: 50
  local_epochs_pretrain: 5
  batch_size: 32
  modality: both
  lr: 0.0001
  weight_decay: 0.01
  weight_by: total
  best_metric: global_UA
  fl_method: fedproc
  fedproc_lambda: 1.0
  fedproc_temperature: 0.5
  fedprox_mu: 0.0
  feddc_correction_weight: 1.0
  feddc_drift_momentum: 0.0
  # One process is the safe setting for the current RTX 4050 Laptop (6 GB).
  num_workers: 1
